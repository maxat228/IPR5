stages:
  - test
  - quality
  - build
  - deploy
  - cleanup

variables:
  PYTHON_VERSION: "3.12"
  DOCKER_VERSION: "24.0.5"
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG_LATEST: $IMAGE_NAME:latest
  IMAGE_TAG_COMMIT: $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_BRANCH: $IMAGE_NAME:$CI_COMMIT_REF_SLUG
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - vendor/
  policy: pull-push

.default_rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual

install-dependencies:
  stage: .pre
  image: python:$PYTHON_VERSION-slim
  script:
    - pip install --cache-dir .cache/pip -r requirements.txt
  artifacts:
    paths:
      - .cache/pip/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
    policy: pull-push

test:
  stage: test
  image: python:$PYTHON_VERSION-slim
  needs: ["install-dependencies"]
  before_script:
    - pip install --cache-dir .cache/pip -r requirements.txt
  script:
    - pytest tests/ -v --junitxml=report.xml --cov=src --cov-report=xml --cov-report=html
    - python -m coverage report
    - python -m coverage report --fail-under=70
  artifacts:
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  rules:
    - !reference [.default_rules, rules]

code-quality:
  stage: quality
  image: python:$PYTHON_VERSION-slim
  needs: ["test"]
  before_script:
    - pip install pylint black
  script:
    - black --check src/ tests/
    - pylint --fail-under=8.0 src/ || echo "Pylint проверка завершена"
    - python -m py_compile src/*.py tests/*.py
  allow_failure: true
  rules:
    - !reference [.default_rules, rules]

build:
  stage: build
  image: docker:$DOCKER_VERSION
  services:
    - docker:$DOCKER_VERSION-dind
  needs: ["test"]
  before_script:
    - docker --version
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG_COMMIT .
    - docker tag $IMAGE_TAG_COMMIT $IMAGE_TAG_BRANCH
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $IMAGE_TAG_COMMIT $IMAGE_TAG_LATEST
      fi
    - docker images $IMAGE_NAME
    - docker run --rm $IMAGE_TAG_COMMIT python -c "from src.calculator import Calculator; calc = Calculator(); print('Test passed: ' + str(calc.add(2, 3)))"
  artifacts:
    paths:
      - docker-images.txt
    reports:
      dotenv: build.env
  rules:
    - !reference [.default_rules, rules]

publish:
  stage: deploy
  image: docker:$DOCKER_VERSION
  services:
    - docker:$DOCKER_VERSION-dind
  needs: ["build"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_TAG_COMMIT
    - docker push $IMAGE_TAG_BRANCH
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker push $IMAGE_TAG_LATEST
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $IMAGE_TAG_COMMIT $IMAGE_NAME:$CI_COMMIT_TAG
        docker push $IMAGE_NAME:$CI_COMMIT_TAG
      fi
    - echo "PUBLISHED_IMAGE=$IMAGE_TAG_COMMIT" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual

deploy-staging:
  stage: deploy
  image: alpine:latest
  needs: ["publish"]
  script:
    - echo "Развертывание версии $CI_COMMIT_SHORT_SHA на staging..."
    - echo "Используется образ: $IMAGE_TAG_COMMIT"
    - echo "Для развертывания выполните:"
    - echo "docker pull $IMAGE_TAG_COMMIT"
    - echo "docker run -d --name calculator-app $IMAGE_TAG_COMMIT"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

cleanup:
  stage: cleanup
  image: docker:$DOCKER_VERSION
  services:
    - docker:$DOCKER_VERSION-dind
  needs: ["publish"]
  script:
    - docker image prune -a --force --filter "until=24h"
  when: always
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: delayed
      start_in: 1 hour

security-scan:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: "5m"
  script:
    - trivy config --exit-code 1 .
    - trivy fs --exit-code 1 --security-checks vuln .
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always