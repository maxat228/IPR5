<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор в Kubernetes</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    input, select { padding: 8px; font-size: 16px; margin: 4px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Калькулятор в Kubernetes</h1>

  <input id="a" type="number" placeholder="Число A" value="2" />
  <select id="op">
    <option value="add">+</option>
    <option value="subtract">−</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
    <option value="power">^</option>
  </select>
  <input id="b" type="number" placeholder="Число B" value="3" />

  <button onclick="calc()">Посчитать</button>

  <pre id="out">—</pre>

  <script>
    async function calc() {
      const a = document.getElementById('a').value;
      const b = document.getElementById('b').value;
      const op = document.getElementById('op').value;
      const url = `/api/calc?op=${op}&a=${a}&b=${b}`;

      const out = document.getElementById('out');
      out.textContent = 'Считаю...';

      try {
        const res = await fetch(url);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = 'Ошибка: ' + e.message;
      }
    }
  </script>
</body>
</html>
